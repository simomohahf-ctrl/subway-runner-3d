{
"imports": {
"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';

// ============================================================
// CORE SETUP
// ============================================================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 250);
camera.position.set(0, 5, 8);
camera.lookAt(0, 2, -10);

// ============================================================
// TEXTURE GENERATION (Procedural — keeps file self-contained)
// ============================================================
function makeCanvasTex(w, h, drawFn) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  drawFn(ctx, w, h);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// Building facade texture
function makeBuildingTex(baseColor, winColor) {
  return makeCanvasTex(256, 256, (ctx) => {
    // Base wall
    const grad = ctx.createLinearGradient(0, 0, 256, 256);
    grad.addColorStop(0, baseColor);
    grad.addColorStop(1, shadeColor(baseColor, -15));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 256, 256);
    // Noise
    for (let i = 0; i < 800; i++) {
      const x = Math.random() * 256, y = Math.random() * 256;
      const a = Math.random() * 0.04;
      ctx.fillStyle = `rgba(0,0,0,${a})`;
      ctx.fillRect(x, y, 2, 2);
    }
    // Windows grid
    const cols = 6, rows = 8;
    const ww = 22, wh = 28, gapX = 10, gapY = 6;
    const startX = (256 - cols * ww - (cols-1) * gapX) / 2;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const x = startX + c * (ww + gapX);
        const y = gapY + r * (wh + gapY);
        // Window frame
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(x-1, y-1, ww+2, wh+2);
        // Glass
        const lit = Math.random() > 0.55;
        if (lit) {
          const wg = ctx.createLinearGradient(x, y, x+ww, y+wh);
          wg.addColorStop(0, winColor);
          wg.addColorStop(1, shadeColor(winColor, -25));
          ctx.fillStyle = wg;
        } else {
          ctx.fillStyle = 'rgba(20,20,40,0.7)';
        }
        ctx.fillRect(x, y, ww, wh);
        // Reflection
        if (lit && Math.random() > 0.5) {
          ctx.fillStyle = 'rgba(255,255,255,0.1)';
          ctx.beginPath();
          ctx.moveTo(x+3, y+3);
          ctx.lineTo(x+ww-3, y+3);
          ctx.lineTo(x+3, y+wh-3);
          ctx.closePath();
          ctx.fill();
        }
      }
    }
  });
}

function shadeColor(hex, percent) {
  const num = parseInt(hex.slice(1), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.max(0, Math.min(255, (num >> 16) + amt));
  const G = Math.max(0, Math.min(255, ((num >> 8) & 0xFF) + amt));
  const B = Math.max(0, Math.min(255, (num & 0xFF) + amt));
  return '#' + (0x1000000 + R*0x10000 + G*0x100 + B).toString(16).slice(1);
}

// Ground / track texture
const groundTex = makeCanvasTex(512, 512, (ctx) => {
  // Asphalt
  ctx.fillStyle = '#2a2a35';
  ctx.fillRect(0, 0, 512, 512);
  // Gravel noise
  for (let i = 0; i < 5000; i++) {
    const x = Math.random()*512, y = Math.random()*512;
    const g = Math.random()*40;
    ctx.fillStyle = `rgba(${30+g},${30+g},${35+g},0.5)`;
    ctx.fillRect(x, y, 3, 3);
  }
  // Lane markings
  for (let lane = 0; lane < 3; lane++) {
    const lx = lane * 170;
    if (lane > 0) {
      ctx.strokeStyle = 'rgba(180,180,200,0.3)';
      ctx.lineWidth = 2;
      ctx.setLineDash([20, 15]);
      ctx.beginPath();
      ctx.moveTo(lx, 0); ctx.lineTo(lx, 512);
      ctx.stroke();
    }
  }
});
groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
groundTex.repeat.set(2, 6);

// Rail texture
const railTex = makeCanvasTex(128, 256, (ctx) => {
  // Metal rail
  const g = ctx.createLinearGradient(0, 0, 128, 0);
  g.addColorStop(0, '#4a4a55');
  g.addColorStop(0.3, '#8a8a95');
  g.addColorStop(0.5, '#aaaabb');
  g.addColorStop(0.7, '#8a8a95');
  g.addColorStop(1, '#4a4a55');
  ctx.fillStyle = g;
  ctx.fillRect(20, 0, 30, 256);
  ctx.fillRect(78, 0, 30, 256);
  // Wooden ties
  for (let y = 0; y < 256; y += 32) {
    const tg = ctx.createLinearGradient(0, y, 0, y+24);
    tg.addColorStop(0, '#6b4a30');
    tg.addColorStop(0.5, '#5a3a20');
    tg.addColorStop(1, '#4a2a15');
    ctx.fillStyle = tg;
    ctx.fillRect(0, y+4, 128, 24);
    // Wood grain
    for (let i = 0; i < 8; i++) {
      ctx.strokeStyle = `rgba(40,25,10,${0.3+Math.random()*0.2})`;
      ctx.beginPath();
      ctx.moveTo(Math.random()*128, y+4);
      ctx.lineTo(Math.random()*128, y+28);
      ctx.stroke();
    }
  }
});

// Sky texture (night gradient)
const skyTex = makeCanvasTex(1024, 512, (ctx) => {
  const g = ctx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, '#0a0a25');
  g.addColorStop(0.35, '#1a1a45');
  g.addColorStop(0.65, '#2a2055');
  g.addColorStop(0.85, '#3a2560');
  g.addColorStop(1, '#4a2868');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1024, 512);
  // Stars
  for (let i = 0; i < 400; i++) {
    const x = Math.random()*1024, y = Math.random()*350;
    const s = Math.random()*2;
    const a = 0.3 + Math.random()*0.7;
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.beginPath();
    ctx.arc(x, y, s, 0, Math.PI*2);
    ctx.fill();
    if (Math.random() > 0.85) {
      ctx.fillStyle = `rgba(200,220,255,${a*0.3})`;
      ctx.beginPath();
      ctx.arc(x, y, s*3, 0, Math.PI*2);
      ctx.fill();
    }
  }
  // Moon
  const mx = 800, my = 80;
  const mg = ctx.createRadialGradient(mx, my, 0, mx, my, 60);
  mg.addColorStop(0, 'rgba(255,250,230,1)');
  mg.addColorStop(0.3, 'rgba(255,245,220,0.8)');
  mg.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = mg;
  ctx.fillRect(mx-60, my-60, 120, 120);
  ctx.fillStyle = 'rgba(255,248,225,1)';
  ctx.beginPath();
  ctx.arc(mx, my, 25, 0, Math.PI*2);
  ctx.fill();
  // Moon craters
  ctx.fillStyle = 'rgba(230,220,200,0.5)';
  ctx.beginPath(); ctx.arc(mx-8, my-5, 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx+10, my+8, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx-3, my+12, 2, 0, Math.PI*2); ctx.fill();
  // City silhouette
  ctx.fillStyle = 'rgba(15,15,35,0.7)';
  let bx = 0;
  while (bx < 1024) {
    const bw = 20 + Math.random()*40;
    const bh = 30 + Math.random()*70;
    ctx.fillRect(bx, 512-bh, bw, bh);
    // Windows in silhouette
    ctx.fillStyle = 'rgba(255,220,150,0.4)';
    for (let wy = 512-bh+5; wy < 510; wy += 10) {
      for (let wx = bx+3; wx < bx+bw-3; wx += 8) {
        if (Math.random() > 0.7) ctx.fillRect(wx, wy, 2, 3);
      }
    }
    ctx.fillStyle = 'rgba(15,15,35,0.7)';
    bx += bw + 2;
  }
});

// ============================================================
// LIGHTING
// ============================================================
const ambient = new THREE.AmbientLight(0x4455aa, 0.45);
scene.add(ambient);

const moonLight = new THREE.DirectionalLight(0x9099ff, 0.5);
moonLight.position.set(40, 60, -20);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.near = 1;
moonLight.shadow.camera.far = 120;
moonLight.shadow.camera.left = -30;
moonLight.shadow.camera.right = 30;
moonLight.shadow.camera.top = 30;
moonLight.shadow.camera.bottom = -30;
moonLight.shadow.bias = -0.0005;
scene.add(moonLight);

// Warm street light
const warmLight = new THREE.PointLight(0xffaa55, 0.8, 30, 1.5);
warmLight.position.set(0, 8, -5);
scene.add(warmLight);

// Fog for depth
scene.fog = new THREE.Fog(0x1a1a35, 25, 110);
scene.background = skyTex;

// ============================================================
// SKYDOME
// ============================================================
const skyGeo = new THREE.SphereGeometry(150, 32, 16);
const skyMat = new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false });
const skyDome = new THREE.Mesh(skyGeo, skyMat);
scene.add(skyDome);

// ============================================================
// CHARACTER — Detailed humanoid
// ============================================================
function createCharacter() {
  const char = new THREE.Group();
  const skin = 0xd4a373;
  const shirt = 0x2563eb;
  const pants = 0x1e3a5f;
  const shoes = 0x1a1a1a;
  const capColor = 0xdc2626;

  // Head
  const head = new THREE.Mesh(
    new THREE.BoxGeometry(0.45, 0.45, 0.4),
    new THREE.MeshStandardMaterial({ color: skin, roughness: 0.6 })
  );
  head.position.y = 2.15;
  head.castShadow = true;
  char.add(head);

  // Cap
  const capBase = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.15, 0.42),
    new THREE.MeshStandardMaterial({ color: capColor, roughness: 0.5 })
  );
  capBase.position.y = 2.4;
  capBase.castShadow = true;
  char.add(capBase);

  const capBrim = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.05, 0.2),
    new THREE.MeshStandardMaterial({ color: capColor, roughness: 0.5 })
  );
  capBrim.position.set(0, 2.36, -0.28);
  capBrim.castShadow = true;
  char.add(capBrim);

  // Hair (back)
  const hair = new THREE.Mesh(
    new THREE.BoxGeometry(0.46, 0.2, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x3a2010, roughness: 0.8 })
  );
  hair.position.set(0, 2.1, 0.22);
  char.add(hair);

  // Eyes
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, 0.02), eyeMat);
  eyeL.position.set(-0.1, 2.18, -0.21);
  char.add(eyeL);
  const eyeR = eyeL.clone();
  eyeR.position.x = 0.1;
  char.add(eyeR);
  // Pupils
  const pupMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1a });
  const pupL = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.01), pupMat);
  pupL.position.set(-0.1, 2.18, -0.22);
  char.add(pupL);
  const pupR = pupL.clone();
  pupR.position.x = 0.1;
  char.add(pupR);

const buildingColors = ['#3d3d6b','#4a3d7a','#5a4d6a','#3d4a7a','#6a5d5d','#4a5d6a','#3d5a7a','#5d4a3d','#6a3d5a','#3d6a5d'];
const winColors = ['#ffdd99','#ffeeaa','#ffd88a','#ffeebb','#ddccaa','#cceeaa'];
const buildingTexs = [];
for (let i = 0; i < 10; i++) {
  buildingTexs.push(makeBuildingTex(buildingColors[i], winColors[i % winColors.length]));
}

function createBuilding(x, z, height, texIndex) {
  const w = 4 + Math.random() * 4;
  const d = 4 + Math.random() * 3;
  const h = height;
  const tex = buildingTexs[texIndex % buildingTexs.length].clone();
  tex.needsUpdate = true;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(Math.max(1, Math.round(h/4)), Math.max(1, Math.round(h/4)));
  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, metalness: 0.1 });
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, h/2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  // Roof detail
  const roofGeo = new THREE.BoxGeometry(w*0.8, 0.5, d*0.8);
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x2a2a35, roughness: 0.8 });
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.position.set(x, h + 0.25, z);
  return [mesh, roof];
}

// SEGMENT SYSTEM
// ============================================================
const SEGMENT_LENGTH = 30;
const NUM_SEGMENTS = 8;
const segments = [];
const obstacles = [];
const coins = [];
const powerUps = [];
const buildings = [];
const streetLights = [];

function createSegment(z) {
  const group = new THREE.Group();
  // Ground section
  const gGeo = new THREE.PlaneGeometry(20, SEGMENT_LENGTH);
  const gMat = new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.9 });
  const g = new THREE.Mesh(gGeo, gMat);
  g.rotation.x = -Math.PI / 2;
  g.position.z = z + SEGMENT_LENGTH/2;
  g.receiveShadow = true;
  group.add(g);
  // Rails
  group.add(createRailMesh(z + SEGMENT_LENGTH/2));
  return group;
}

function spawnBuildings(z) {
  // Buildings on both sides
  for (let side = -1; side <= 1; side += 2) {
    const baseX = side * 8;
    for (let i = 0; i < 3; i++) {
      const x = baseX + (Math.random()-0.5) * 5 + side * i * 3;
      const h = 8 + Math.random() * 20;
      const [mesh, roof] = createBuilding(x, z + Math.random() * SEGMENT_LENGTH - SEGMENT_LENGTH/2, h, Math.floor(Math.random() * 10));
      buildings.push(mesh, roof);
      scene.add(mesh, roof);
    }
  }
  // Street lights
  for (let side = -1; side <= 1; side += 2) {
    const sl = createStreetLight(side * 3.5, z + Math.random() * SEGMENT_LENGTH - SEGMENT_LENGTH/2);
    streetLights.push(sl);
    scene.add(sl);
  }
}

function spawnObstacles(z) {
  // Clear old obstacles in this z range
  // 1-3 obstacles per segment
  const numObs = 1 + Math.floor(Math.random() * 3);
  const usedLanes = new Set();
  for (let i = 0; i < numObs; i++) {
    let lane = Math.floor(Math.random() * 3);
    let attempts = 0;
    while (usedLanes.has(lane) && attempts < 3) { lane = Math.floor(Math.random() * 3); attempts++; }
    usedLanes.add(lane);
    const obsZ = z + 5 + Math.random() * (SEGMENT_LENGTH - 10);
    const types = ['train', 'barrier', 'beam', 'cone', 'ramp'];
    const type = types[Math.floor(Math.random() * types.length)];
    let obs;
    if (type === 'train') obs = createTrain(lane, obsZ);
    else if (type === 'barrier') obs = createBarrier(lane, obsZ);
    else if (type === 'beam') obs = createBeam(lane, obsZ);
    else if (type === 'cone') obs = createCone(lane, obsZ);
    else obs = createRamp(lane, obsZ);
    obstacles.push(obs);
    scene.add(obs);
  }
  // Coins — trails of 3-8 coins
  const numTrails = 1 + Math.floor(Math.random() * 2);
  for (let t = 0; t < numTrails; t++) {
    const lane = Math.floor(Math.random() * 3);
    const startZ = z + Math.random() * (SEGMENT_LENGTH - 10);
    const count = 3 + Math.floor(Math.random() * 6);
    const elevated = Math.random() > 0.7;
    for (let c = 0; c < count; c++) {
      const y = elevated ? 1.5 + Math.sin(c * 0.5) * 0.5 : 0.8;
      const coin = createCoin(lanePositions[lane], y, startZ + c * 1.2);
      coins.push(coin);
      scene.add(coin);
    }
  }
  // Power-ups (rare)
  if (Math.random() > 0.75) {
    const lane = Math.floor(Math.random() * 3);
    const types = ['magnet', 'x2', 'jet'];
    const ptype = types[Math.floor(Math.random() * 3)];
    const pu = createPowerUp(ptype, lane, z + Math.random() * SEGMENT_LENGTH);
    powerUps.push(pu);
    scene.add(pu);
  }
}

function createInitialSegments() {
  for (let i = 0; i < NUM_SEGMENTS; i++) {
    const seg = createSegment(-i * SEGMENT_LENGTH);
    segments.push({ mesh: seg, z: -i * SEGMENT_LENGTH });
    scene.add(seg);
    spawnBuildings(-i * SEGMENT_LENGTH);
    if (i >= 2) spawnObstacles(-i * SEGMENT_LENGTH);
  }
}

createInitialSegments();

// ============================================================
// GAME STATE
// ============================================================
let gameState = 'menu'; // menu, playing, paused, over
let score = 0;
let coinCount = 0;
let highScore = parseInt(localStorage.getItem('sr3d-hi') || '0');
let gameSpeed = 0.42;
const SPEED_INC = 0.00012;
const BASE_SPEED = 0.42;
const MAX_SPEED = 1.2;

let playerLane = 1; // 0, 1, 2
let playerX = 0;
let targetX = 0;
let playerY = 0;
let isJumping = false;
let jumpVel = 0;
let isSliding = false;
let slideTimer = 0;
let magnetTimer = 0;
let x2Timer = 0;
let jetTimer = 0;

document.getElementById('hi-score').textContent = highScore;

// ============================================================
// ANIMATION
// ============================================================
let runCycle = 0;

function animateCharacter(dt) {
  if (gameState !== 'playing') return;
  const u = character.userData;
  runCycle += dt * gameSpeed * 12;
  const swing = Math.sin(runCycle) * 0.4;
  if (isJumping) {
    u.armL.rotation.x = -0.8;
    u.armR.rotation.x = -0.8;
    u.legL.rotation.x = -0.3;
    u.legR.rotation.x = 0.3;
  } else if (isSliding) {
    u.armL.rotation.x = 0.8;
    u.armR.rotation.x = 0.8;
    u.legL.rotation.x = 1.2;
    u.legR.rotation.x = 1.2;
  } else {
    u.armL.rotation.x = swing;
    u.armR.rotation.x = -swing;
    u.legL.rotation.x = -swing;
    u.legR.rotation.x = swing;
    // Subtle head bob
    u.head.position.y = 2.15 + Math.abs(Math.sin(runCycle)) * 0.05;
  }
}

// ============================================================
// CONTROLS
// ============================================================
function moveLane(dir) {
  if (gameState !== 'playing') return;
  const newLane = playerLane + dir;
  if (newLane >= 0 && newLane <= 2) {
    playerLane = newLane;
    targetX = lanePositions[playerLane];
  }
}

function jump() {
  if (gameState !== 'playing' || isJumping || isSliding) return;
  isJumping = true;
  jumpVel = 0.32;
  playSound('jump');
}

function slide() {
  if (gameState !== 'playing' || isJumping) return;
  isSliding = true;
  slideTimer = 0.8;
  playSound('slide');
}

// Keyboard
window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft') moveLane(-1);
  else if (e.code === 'ArrowRight') moveLane(1);
  else if (e.code === 'ArrowUp' || e.code === 'Space') jump();
  else if (e.code === 'ArrowDown') slide();
  else if (e.code === 'Escape') togglePause();
});

// Touch
let touchStart = null;
canvas.addEventListener('touchstart', (e) => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
}, { passive: true });

canvas.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < 30) return; // tap, not swipe
  if (Math.abs(dx) > Math.abs(dy)) {
    moveLane(dx > 0 ? 1 : -1);
  } else {
    if (dy < 0) jump();
    else slide();
  }
  touchStart = null;
}, { passive: true });

// ============================================================
// SOUND (Web Audio API — procedural)
// ============================================================
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playSound(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  if (type === 'coin') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.exponentialRampToValueAtTime(1320, now + 0.1);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  } else if (type === 'jump') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.exponentialRampToValueAtTime(440, now + 0.1);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.start(now); osc.stop(now + 0.12);
  } else if (type === 'slide') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
    gain.gain.setValueAtTime(0.06, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    osc.start(now); osc.stop(now + 0.2);
  } else if (type === 'hit') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.start(now); osc.stop(now + 0.3);
  } else if (type === 'power') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc.start(now); osc.stop(now + 0.25);
  }
}

// ============================================================
// FLASH EFFECTS
// ============================================================
function flash(type) {
  const el = document.getElementById('flash-' + type);
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, type === 'hit' ? 200 : 300);
}

// ============================================================
// COLLISION
// ============================================================
function checkCollision(obs) {
  const px = playerX;
  const py = playerY;
  const pz = character.position.z;
  const ud = obs.userData;
  const ox = obs.position.x;
  const oy = obs.position.y;
  const oz = obs.position.z;
  // Z proximity
  if (Math.abs(oz - pz) > ud.l / 2 + 0.5) return false;
  // Lane check
  if (Math.abs(ox - px) > ud.w / 2 + 0.4) return false;
  // Height check
  if (ud.type === 'train') {
    // Can't jump over trains (too tall)
    if (py < ud.h) return true;
    return false;
  }
  if (ud.jumpable && isJumping && py > ud.h) return false;
  if (ud.slideable && isSliding && py < 0.5) return false;
  // Default collision
  if (py < ud.h) return true;
  return false;
}

// ============================================================
// GAME UPDATE
// ============================================================
function updateGame(dt) {
  if (gameState !== 'playing') return;

  // Speed increase
  gameSpeed = Math.min(MAX_SPEED, gameSpeed + SPEED_INC);

  // Score
  score += gameSpeed * 2;
  if (x2Timer > 0) score += gameSpeed * 2;
  document.getElementById('score-val').textContent = Math.floor(score);

  // Character movement
  playerX += (targetX - playerX) * 0.2;
  character.position.x = playerX;

  // Jump physics
  if (isJumping) {
    playerY += jumpVel;
    jumpVel -= 0.018;
    if (playerY <= 0) { playerY = 0; isJumping = false; jumpVel = 0; }
  }
  character.position.y = playerY;

  // Jetpack override
  if (jetTimer > 0) {
    playerY = Math.min(playerY + 0.15, 3.5);
    character.position.y = playerY;
    if (!isJumping) { isJumping = true; jumpVel = 0; }
  }

  // Slide
  if (isSliding) {
    slideTimer -= dt;
    character.scale.y = 0.5;
    if (slideTimer <= 0) { isSliding = false; character.scale.y = 1; }
  } else {
    character.scale.y = 1;
  }

  // Power-up timers
  if (magnetTimer > 0) magnetTimer -= dt;
  if (x2Timer > 0) x2Timer -= dt;
  if (jetTimer > 0) {
    jetTimer -= dt;
    if (jetTimer <= 0) { isJumping = false; jumpVel = -0.1; }
  }

  updatePowerBadge();

  // Move segments
  for (const seg of segments) {
    seg.z += gameSpeed;
    seg.mesh.position.z = seg.z;
    if (seg.z > SEGMENT_LENGTH) {
      seg.z -= NUM_SEGMENTS * SEGMENT_LENGTH;
      seg.mesh.position.z = seg.z;
      spawnObstacles(seg.z);
      spawnBuildings(seg.z);
    }
  }

  // Move obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];
    obs.position.z += gameSpeed;
    obs.userData.z += gameSpeed;
    if (obs.position.z > 15) {
      scene.remove(obs);
      obstacles.splice(i, 1);
      continue;
    }
    if (checkCollision(obs)) {
      gameOver();
      return;
    }
  }

  // Move coins
  for (let i = coins.length - 1; i >= 0; i--) {
    const coin = coins[i];
    coin.rotation.y += 0.05;
    coin.position.z += gameSpeed;
    // Magnet effect
    if (magnetTimer > 0) {
      const dx = playerX - coin.position.x;
      const dy = (playerY + 0.5) - coin.position.y;
      if (Math.abs(coin.position.z - character.position.z) < 8) {
        coin.position.x += dx * 0.2;
        coin.position.y += dy * 0.2;
      }
    }
    if (coin.position.z > 15) {
      scene.remove(coin);
      coins.splice(i, 1);
      continue;
    }
    // Collect
    if (Math.abs(coin.position.z - character.position.z) < 0.8 &&
        Math.abs(coin.position.x - playerX) < 0.5 &&
        Math.abs(coin.position.y - (playerY + 0.8)) < 1.2) {
      scene.remove(coin);
      coins.splice(i, 1);
      coinCount++;
      score += 10;
      if (x2Timer > 0) score += 10;
      document.getElementById('coin-val').textContent = coinCount;
      playSound('coin');
      flash('coin');
      emitSparks(coin.position.x, coin.position.y, coin.position.z);
    }
  }

  // Move power-ups
  for (let i = powerUps.length - 1; i >= 0; i--) {
    const pu = powerUps[i];
    pu.rotation.y += 0.03;
    pu.position.z += gameSpeed;
    pu.position.y = 1.2 + Math.sin(Date.now() * 0.003) * 0.2;
    if (pu.position.z > 15) {
      scene.remove(pu);
      powerUps.splice(i, 1);
      continue;
    }
    if (Math.abs(pu.position.z - character.position.z) < 1 &&
        Math.abs(pu.position.x - playerX) < 0.8) {
      scene.remove(pu);
      powerUps.splice(i, 1);
      const pt = pu.userData.ptype;
      if (pt === 'magnet') magnetTimer = 8;
      else if (pt === 'x2') x2Timer = 10;
      else if (pt === 'jet') jetTimer = 5;
      playSound('power');
      flash('power');
    }
  }

  // Move buildings
  for (let i = buildings.length - 1; i >= 0; i--) {
    const b = buildings[i];
    b.position.z += gameSpeed;
    if (b.position.z > 30) {
      scene.remove(b);
      buildings.splice(i, 1);
    }
  }

  // Move street lights
  for (let i = streetLights.length - 1; i >= 0; i--) {
    const sl = streetLights[i];
    sl.position.z += gameSpeed;
    if (sl.position.z > 30) {
      scene.remove(sl);
      streetLights.splice(i, 1);
    }
  }

  // Update dust particles
  for (let i = 0; i < dustCount; i++) {
    dustPositions[i*3] += dustVelocities[i*3];
    dustPositions[i*3+1] += dustVelocities[i*3+1];
    dustPositions[i*3+2] += gameSpeed;
    if (dustPositions[i*3+2] > 15) {
      dustPositions[i*3] = (Math.random()-0.5) * 8;
      dustPositions[i*3+1] = Math.random() * 3;
      dustPositions[i*3+2] = -80 - Math.random() * 40;
    }
  }
  dustGeo.attributes.position.needsUpdate = true;

  // Update sparks
  for (let i = 0; i < sparkCount; i++) {
    if (sparkLife[i] > 0) {
      sparkLife[i] -= dt * 2;
      sparkPositions[i*3] += sparkVelocities[i*3];
      sparkPositions[i*3+1] += sparkVelocities[i*3+1];
      sparkPositions[i*3+2] += sparkVelocities[i*3+2] + gameSpeed;
      sparkVelocities[i*3+1] -= 0.01;
      if (sparkLife[i] <= 0) {
        sparkPositions[i*3+1] = -100;
      }
    }
  }
  sparkGeo.attributes.position.needsUpdate = true;

  // Camera follow
  camera.position.x = playerX * 0.3;
  camera.position.y = 5 + playerY * 0.3;
  camera.lookAt(playerX * 0.2, 2, -10);

  // Sky dome follows camera
  skyDome.position.copy(camera.position);

  // Warm light follows character
  warmLight.position.set(character.position.x, 8, character.position.z - 3);

  // Speed lines effect
  const sl = document.getElementById('speed-lines');
  if (gameSpeed > 0.7) {
    sl.style.opacity = Math.min(0.4, (gameSpeed - 0.7) * 0.8);
  } else {
    sl.style.opacity = 0;
  }

  animateCharacter(dt);
}

// ============================================================
// POWER-UP BADGE
// ============================================================
function updatePowerBadge() {
  const badge = document.getElementById('pw-badge');
  let active = null;
  if (magnetTimer > 0) active = { type: 'magnet', label: '🧲 مغناطيس', time: magnetTimer };
  else if (x2Timer > 0) active = { type: 'x2', label: '✨ ضعف النقاط', time: x2Timer };
  else if (jetTimer > 0) active = { type: 'jet', label: '🚀 طيران', time: jetTimer };

  if (active) {
    badge.className = 'pw-badge show ' + active.type;
    badge.textContent = active.label + ' (' + Math.ceil(active.time) + 's)';
  } else {
    badge.className = 'pw-badge';
  }
}

// ============================================================
// GAME FLOW
// ============================================================
function startGame() {
  gameState = 'playing';
  score = 0;
  coinCount = 0;
  gameSpeed = BASE_SPEED;
  playerLane = 1;
  playerX = 0;
  targetX = 0;
  playerY = 0;
  isJumping = false;
  isSliding = false;
  magnetTimer = 0;
  x2Timer = 0;
  jetTimer = 0;
  character.position.set(0, 0, 0);
  character.scale.set(1, 1, 1);

  // Clear existing objects
  obstacles.forEach(o => scene.remove(o));
  coins.forEach(c => scene.remove(c));
  powerUps.forEach(p => scene.remove(p));
  buildings.forEach(b => scene.remove(b));
  streetLights.forEach(s => scene.remove(s));
  obstacles.length = 0;
  coins.length = 0;
  powerUps.length = 0;
  buildings.length = 0;
  streetLights.length = 0;

  // Recreate segments
  segments.forEach(s => scene.remove(s.mesh));
  segments.length = 0;
  createInitialSegments();

  document.getElementById('menu').classList.add('hide');
  document.getElementById('over').classList.remove('show');
  document.getElementById('hud').classList.add('show');
  document.getElementById('coin-val').textContent = '0';
  document.getElementById('score-val').textContent = '0';

  initAudio();
}

function gameOver() {
  gameState = 'over';
  playSound('hit');
  flash('hit');
  if (score > highScore) {
    highScore = Math.floor(score);
    localStorage.setItem('sr3d-hi', highScore);
  }
  document.getElementById('final-score').textContent = Math.floor(score);
  document.getElementById('final-coins').textContent = coinCount;
  document.getElementById('best-score').textContent = highScore;
  document.getElementById('over').classList.add('show');
  document.getElementById('hud').classList.remove('show');
}

function togglePause() {
  if (gameState === 'playing') {
    gameState = 'paused';
    document.getElementById('pause-ov').classList.add('show');
  } else if (gameState === 'paused') {
    gameState = 'playing';
    document.getElementById('pause-ov').classList.remove('show');
  }
}

// ============================================================
// UI EVENTS
// ============================================================
document.getElementById('play').addEventListener('click', startGame);
document.getElementById('restart').addEventListener('click', startGame);
document.getElementById('pause-btn').addEventListener('click', togglePause);
document.getElementById('resume').addEventListener('click', togglePause);

// ============================================================
// RESIZE
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// RENDER LOOP
// ============================================================
let lastTime = performance.now();
function render() {
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  updateGame(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(render);
}

// Hide loader and start
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('load').classList.add('hide');
  }, 500);
  render();
});

// Start rendering immediately
render();
</script>
